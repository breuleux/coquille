[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
# macOS on Apple Silicon, and a fully-static Linux x86-64 build (musl) so the
# binaries run on any distro, including old ones reached over ssh.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-musl"]
# Where to host releases
hosting = "github"
