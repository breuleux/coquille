[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT"
repository = "https://github.com/breuleux/coquille"

[profile.release]
strip = true
# Link-time optimization over the whole program, in a single codegen unit:
# faster (and smaller) executables, slower release builds.
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
# Full release build: keep the fat LTO / single-codegen tuning above,
# since these binaries are what we ship.
inherits = "release"
